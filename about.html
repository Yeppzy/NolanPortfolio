<script>
  const lenis = new Lenis({
    duration: 1,
    easing: (t) => 1 - Math.pow(1 - t, 2),
    smoothWheel: true,
    wheelMultiplier: 0.10,
    touchMultiplier: 0.75,
    infinite: false,
  });

  function raf(time) {
    lenis.raf(time);
    requestAnimationFrame(raf);
  }

  requestAnimationFrame(raf);
</script>
